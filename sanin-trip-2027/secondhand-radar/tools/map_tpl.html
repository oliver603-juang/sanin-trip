<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沿路二手店雷達</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#2B2A28;--mute:#8C8578;--line:#E3DED3}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans TC","Hiragino Sans","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:14px;align-items:center;padding:12px 16px 6px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.ov{display:flex;gap:10px;align-items:center;margin-left:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sep{width:1px;background:var(--line);margin:0 4px}
#map{height:66vh;min-height:380px;margin:0 16px;border-radius:12px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 16px;font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.pieicon{background:none;border:none}
.pieicon svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));transition:transform .15s}
.pieicon:hover svg{transform:scale(1.12)}
.leaflet-popup-content{margin:12px 14px}
.sc{width:300px;font-size:12.5px}
.sc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sc h3{font-size:15px;margin:0}
.sc .m{font-size:12px;color:var(--mute);margin-top:2px}
.sc .body{display:flex;gap:12px;align-items:center;margin:8px 0}
.lg{list-style:none;padding:0;margin:0;font-size:12.5px;flex:1}
.lg li{display:flex;gap:6px;align-items:center;margin:2px 0}.lg b{margin-left:auto}.lg i{color:var(--mute);font-style:normal;width:34px;text-align:right}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.kv{margin:4px 0;line-height:1.7}.kv b{color:var(--mute);font-weight:500;margin-right:4px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin:0 3px 3px 0;font-size:11.5px}.tag.a{border-style:dashed}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}.go{background:#13804A;color:#fff}.maybe{background:#E89B00;color:#fff}.in{background:var(--line)}.same{background:#DCEAF7;color:#1767B3;white-space:normal;max-width:120px;text-align:center}.no{color:var(--mute);border:1px solid var(--line)}
.th{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.th a{display:block;width:44px;height:44px;border-radius:6px;overflow:hidden;background:var(--line)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.recent{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;max-height:150px;overflow:auto}
.recent div{margin:2px 0}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.btns a,.btns button{font-size:12px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
.btns a.off{opacity:.35;pointer-events:none}
.hit{background:#FFF1C2;border-radius:4px;padding:0 4px;font-size:11px}
#list{padding:4px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.day{grid-column:1/-1;font-weight:700;margin:12px 0 0;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.card .n{font-weight:600;font-size:13.5px}.card .m{font-size:12px;color:var(--mute);margin-top:2px}
</style>
</head>
<body>
<header><div><h1>2027 山陰冬遊・沿路二手店雷達</h1><div class="sub" id="upd"></div></div><div class="ov" id="ov"></div></header>
<div class="filters" id="f"></div>
<div id="map"></div>
<div class="legend" id="lg"></div>
<div id="list"></div>
<script>
/*DATA*/
const DAYC=["#1767B3","#D61F35","#13804A","#E89B00","#7B52AE","#A86B25"];
const CATS=["玩具","公仔","3C","衣物配件","其他"];
const COL={"玩具":"#E89B00","公仔":"#D61F35","3C":"#1767B3","衣物配件":"#7B52AE","其他":"#8C8578"};
const INPWA=new Set(["hobbyoff-himeji-mitachi","offhouse-himeji-nozato","hobbyoff-kobe-seiryodai","hardoff-sanda"]);
const SAME={"hardoff-himeji-mitachi":"與行程中 Hobby Off 御立同一處","offhouse-himeji-mitachi":"與行程中 Hobby Off 御立同一處","offhouse-kobe-seiryodai":"與行程中 Hobby Off 星陵台同址"};
let fDay=new Set(),fCat=new Set(),fHit=false,fRecent=false,fPlat='all';const REC=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const small=u=>u.replace('name=large','name=small');
function pie(c,size,center){const tot=CATS.reduce((a,k)=>a+(c[k]||0),0);const r=size/2-1.5,cx=size/2,cy=size/2;let a=-Math.PI/2,o='';
 if(!tot)return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#ccc" stroke="#fff" stroke-width="2"/></svg>`;
 for(const k of CATS){const v=c[k]||0;if(!v)continue;if(v>=tot){o+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${COL[k]}"/>`;break}
  const b=a+2*Math.PI*v/tot,la=b-a>Math.PI?1:0;o+=`<path d="M${cx},${cy}L${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}A${r},${r} 0 ${la} 1 ${(cx+r*Math.cos(b)).toFixed(1)},${(cy+r*Math.sin(b)).toFixed(1)}Z" fill="${COL[k]}"><title>${k} ${v}</title></path>`;a=b}
 o+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-width="2"/>`;
 if(center)o+=`<circle cx="${cx}" cy="${cy}" r="${(r*.5).toFixed(1)}" fill="#fff"/><text x="${cx}" y="${cy+size*.06}" text-anchor="middle" font-size="${Math.round(size*.2)}" font-weight="700" fill="#2B2A28">${tot}</text>`;
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${o}</svg>`}
function legend(c){const tot=CATS.reduce((a,k)=>a+(c[k]||0),0)||1;return '<ul class="lg">'+CATS.map(k=>`<li><span class="sw" style="background:${COL[k]}"></span>${k}<b>${c[k]||0}</b><i>${Math.round((c[k]||0)*100/tot)}%</i></li>`).join('')+'</ul>'}
function count(arr,key,skip){const m={};arr.forEach(p=>(p[key]||[]).forEach(t=>{if(!skip||!skip.includes(t))m[t]=(m[t]||0)+1}));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function stat(s){const ps=POSTS.filter(p=>p.storeId===s.id&&(fPlat==='all'||(p.platforms||['x']).includes(fPlat))&&(!fRecent||p.date>=REC)&&(!fCat.size||p.categories.some(c=>fCat.has(c)))&&(!fHit||(p.hit&&p.hit.length))).sort((a,b)=>b.date.localeCompare(a.date));
 const c={};CATS.forEach(k=>c[k]=0);ps.forEach(p=>p.categories.forEach(k=>{c[k]=(c[k]||0)+1/p.categories.length}));CATS.forEach(k=>c[k]=Math.round(c[k]));
 const core=c['玩具']+c['3C']+c['衣物配件'];return{ps,c,core,share:ps.length?core/ps.length:0}}
function reco(s,st){if(INPWA.has(s.id))return '<span class="pill in">已在行程</span>';if(SAME[s.id])return `<span class="pill same">${SAME[s.id]}，延長停留</span>`;
 if(st.core>=40&&st.share>=.5)return '<span class="pill go">建議加入</span>';if(st.core>=20)return '<span class="pill maybe">可考慮</span>';return '<span class="pill no">量少</span>'}
function card(s,st){const nav='https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lon;
 const tags=count(st.ps,'tags').slice(0,8),attrs=count(st.ps,'attrs',['收購情報','Offmall 上架']).slice(0,4);
 const nm={};st.ps.forEach(p=>{if(p.name&&p.name.length>1&&p.name.length<26)nm[p.name]=(nm[p.name]||0)+1});const names=Object.entries(nm).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
 const pics=st.ps.filter(p=>((p.imgs&&p.imgs.length)||p.th)&&['玩具','3C','衣物配件'].includes(p.categories[0])).slice(0,6);
 return `<div class="sc"><div class="hd"><div><h3>${esc(s.name)}</h3><div class="m">Day ${s.day}・近 ${esc(s.near)}・繞路約 ${s.detourMin} 分</div></div>${reco(s,st)}</div>
<div class="body">${pie(st.c,96,true)}${legend(st.c)}</div>
<div class="kv"><b>玩具＋3C＋衣物</b>${st.core} 則（${Math.round(st.share*100)}%）</div>
<div class="kv"><b>來源</b>${(()=>{const x=st.ps.filter(p=>(p.platforms||['x']).includes('x')).length,i=st.ps.filter(p=>(p.platforms||[]).includes('ig')).length,b=st.ps.filter(p=>(p.platforms||[]).length>1).length;return `<span class="tag">X ${x}</span><span class="tag">IG ${i}</span><span class="tag a">重複 ${b}</span>`+(s.ig?` <a href="https://www.instagram.com/${s.ig}/" target="_blank">IG 帳號</a>`:'')})()}</div>
<div class="kv"><b>標籤</b>${tags.map(([t,n])=>`<span class="tag">${esc(t)} ${n}</span>`).join('')||'—'}</div>
<div class="kv"><b>屬性</b>${attrs.map(([t,n])=>`<span class="tag a">${esc(t)} ${n}</span>`).join('')||'—'}</div>
${names.length?`<div class="kv"><b>常見商品</b>${names.map(esc).join('、')}</div>`:''}
<div class="th">${pics.map(p=>{const href=(p.imgs&&p.imgs.length)?p.imgs[0]:p.url;const src=(p.imgs&&p.imgs.length)?small(p.imgs[0]):p.th;return `<a href="${href}" target="_blank" rel="noopener" title="${esc(p.date+' '+(p.name||''))}"><img loading="lazy" src="${src}" alt=""></a>`}).join('')}</div>
<div class="recent">${st.ps.slice(0,10).map(p=>`<div>${p.date.slice(5)} ${esc(p.highlight.slice(0,40))} ${p.hit&&p.hit.length?'<span class="hit">🎯'+esc(p.hit.join('、'))+'</span>':''} ${(p.platforms||['x']).includes('x')?`<a href="${p.url}" target="_blank">X</a>`:''} ${p.igUrl||(p.platforms||[])[0]==='ig'?`<a href="${p.igUrl||p.url}" target="_blank">IG</a>`:''}</div>`).join('')||'這段期間沒有貼文'}</div>
<div class="btns"><a href="${nav}" target="_blank">導航</a><a href="https://x.com/${s.x}" target="_blank">看分店 X</a><a class="${s.netmall?'':'off'}" href="${s.netmall||'#'}" target="_blank">netmall</a><button onclick="cp('${s.id}')">📋 複製地點</button></div></div>`}
function cp(id){const s=STORES.find(x=>x.id===id);const t=s.name+' @'+s.lat+','+s.lon;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('已複製：'+t)).catch(()=>prompt('複製這段：',t))}
const map=L.map('map',{scrollWheelZoom:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
const all=[];
ROUTE.forEach((d,i)=>{const ll=d.pts.map(p=>[p.lat,p.lon]);all.push(...ll);L.polyline(ll,{color:DAYC[i],weight:3,opacity:.7}).addTo(map).bindTooltip('Day '+d.day+'・'+d.title);ll.forEach((x,j)=>L.circleMarker(x,{radius:3,color:DAYC[i],weight:1,fillOpacity:1}).addTo(map).bindTooltip(d.pts[j].name))});
map.fitBounds(all,{padding:[20,20]});
const OFF={};(()=>{const g={};STORES.forEach(s=>{const k=s.lat.toFixed(3)+','+s.lon.toFixed(3);(g[k]=g[k]||[]).push(s)});Object.values(g).forEach(a=>{if(a.length<2){OFF[a[0].id]=[a[0].lat,a[0].lon];return}a.forEach((s,i)=>{const ang=2*Math.PI*i/a.length,d=0.0028;OFF[s.id]=[s.lat+d*Math.sin(ang),s.lon+d*Math.cos(ang)/Math.cos(s.lat*Math.PI/180)]})})})();
const layer=L.layerGroup().addTo(map);const mk={};
function ok(s,st){if(fDay.size&&!fDay.has(s.day))return false;if((fCat.size||fHit||fRecent||fPlat!=='all')&&!st.ps.length)return false;return true}
function render(){layer.clearLayers();const L2=document.getElementById('list');L2.innerHTML='';const by={};const tot={};CATS.forEach(k=>tot[k]=0);let n=0;
 STORES.forEach(s=>{const st=stat(s);if(!ok(s,st))return;CATS.forEach(k=>tot[k]+=st.c[k]);n+=st.ps.length;
  const d=Math.round(26+Math.min(30,Math.sqrt(st.ps.length)*2.2));
  const m=L.marker(OFF[s.id],{icon:L.divIcon({className:'pieicon',html:pie(st.c,d,false),iconSize:[d,d],iconAnchor:[d/2,d/2],popupAnchor:[0,-d/2]}),riseOnHover:true})
   .bindPopup(card(s,st),{maxWidth:330,minWidth:300,autoPanPadding:[20,20]}).bindTooltip(s.name+'・'+st.ps.length+' 則',{direction:'top',offset:[0,-d/2]});
  layer.addLayer(m);mk[s.id]=m;(by[s.day]=by[s.day]||[]).push([s,st])});
 document.getElementById('ov').innerHTML=pie(tot,64,false)+`<div style="font-size:12px">${legend(tot).replace('class="lg"','class="lg" style="min-width:140px"')}</div>`;
 document.getElementById('upd').textContent='更新：'+UPDATED.replace('T',' ').slice(0,16)+'　店 '+STORES.length+' 家・顯示 '+n+' 則（9/1 起・X＋IG 去重後・已排除卡牌與遊戲軟體）';
 Object.keys(by).sort().forEach(d=>{const h=document.createElement('div');h.className='day';h.style.color=DAYC[d-1];h.textContent='Day '+d+'　'+(ROUTE[d-1].date||'')+' '+(ROUTE[d-1].title||'');L2.appendChild(h);
  by[d].sort((a,b)=>b[1].core-a[1].core).forEach(([s,st])=>{const c=document.createElement('div');c.className='card';
   c.innerHTML=pie(st.c,44,false)+`<div><div class="n">${esc(s.name)}</div><div class="m">${st.ps.length} 則・玩具+3C+衣物 ${st.core}・繞路 ${s.detourMin} 分</div><div style="margin-top:4px">${reco(s,st)}</div></div>`;
   c.onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});map.setView(OFF[s.id],14);setTimeout(()=>mk[s.id].openPopup(),350)};L2.appendChild(c)})})}
const F=document.getElementById('f');
function chip(t,fn){const c=document.createElement('span');c.className='chip';c.textContent=t;c.onclick=()=>{fn();c.classList.toggle('on');render()};F.appendChild(c)}
for(let d=1;d<=6;d++)chip('Day '+d,()=>fDay.has(d)?fDay.delete(d):fDay.add(d));
F.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
CATS.forEach(k=>chip(k,()=>fCat.has(k)?fCat.delete(k):fCat.add(k)));
F.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
chip('🎯 只看命中清單',()=>fHit=!fHit);chip('🕒 只看近 7 天',()=>fRecent=!fRecent);
F.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
[['all','平台：全部'],['x','只看 X'],['ig','只看 IG']].forEach(([v,l])=>{const c=document.createElement('span');c.className='chip plat'+(v==='all'?' on':'');c.textContent=l;c.onclick=()=>{fPlat=v;document.querySelectorAll('.chip.plat').forEach(e=>e.classList.toggle('on',e===c));render()};F.appendChild(c)});
document.getElementById('lg').innerHTML=CATS.map(k=>`<span><span class="dot" style="background:${COL[k]}"></span>${k}</span>`).join('')+'<span>・小圓餅＝該店商品分類比例，越大＝貼文越多・點圓餅看分析卡片</span>';
render();
</script>
</body>
</html>
