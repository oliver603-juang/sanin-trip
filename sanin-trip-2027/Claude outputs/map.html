<div style="font-size:12px;color:#8C8578">主力：${st.top}</div>
<ul>${st.ps.slice(0,8).map(p=>`<li>${p.date.slice(5)} ${esc(p.highlight)} ${p.hit&&p.hit.length?'<span class="hit">🎯'+esc(p.hit.join('、'))+'</span>':''} <a href="${p.url}" target="_blank">X</a>${thumbs(p)}</li>`).join('')||'<li>這段期間沒有貼文</li>'}</ul>
<div class="btns"><a href="${nav}" target="_blank">導航</a><a href="https://x.com/${s.x}" target="_blank">看分店 X</a><a class="${s.netmall?'':'off'}" href="${s.netmall||'#'}" target="_blank">netmall</a><button onclick="cp('${s.id}')">📋 複製地點</button></div></div>`}
function cp(id){const s=STORES.find(x=>x.id===id);const t=s.name+' @'+s.lat+','+s.lon;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('已複製：'+t)).catch(()=>prompt('複製這段：',t))}
const OFF={};(()=>{const g={};STORES.forEach(s=>{const k=s.lat.toFixed(3)+','+s.lon.toFixed(3);(g[k]=g[k]||[]).push(s)});Object.values(g).forEach(a=>{if(a.length<2){OFF[a[0].id]=[a[0].lat,a[0].lon];return}a.forEach((s,i)=>{const ang=2*Math.PI*i/a.length,d=0.0022;OFF[s.id]=[s.lat+d*Math.sin(ang),s.lon+d*Math.cos(ang)/Math.cos(s.lat*Math.PI/180)]})})})();
const layer=L.layerGroup().addTo(map);const mk={};
function ok(s,st){if(fDay.size&&!fDay.has(s.day))return false;if((fCat.size||fHit||fRecent)&&!st.ps.length)return false;return true}
function render(){layer.clearLayers();const L2=document.getElementById('list');L2.innerHTML='';const by={};
STORES.forEach(s=>{const st=stat(s);if(!ok(s,st))return;const r=6+Math.min(14,Math.sqrt(st.ps.length)*4);
const m=L.circleMarker(OFF[s.id],{radius:r,color:'#fff',weight:2,fillColor:CATC[st.top],fillOpacity:.9}).bindPopup(popup(s,st)).bindTooltip(s.name);layer.addLayer(m);mk[s.id]=m;(by[s.day]=by[s.day]||[]).push([s,st])});
Object.keys(by).sort().forEach(d=>{const h=document.createElement('div');h.className='day';h.style.color=DAYC[d-1];h.textContent='Day '+d+'　'+(ROUTE[d-1].date||'')+' '+(ROUTE[d-1].title||'');L2.appendChild(h);
by[d].sort((a,b)=>a[0].detourMin-b[0].detourMin).forEach(([s,st])=>{const c=document.createElement('div');c.className='card';
c.innerHTML=`<div class="n"><span class="dot" style="background:${CATC[st.top]}"></span>${esc(s.name)}</div><div class="m">近 ${esc(s.near)}・繞路 ${s.detourMin} 分・貼文 ${st.ps.length}・主力 ${st.top}</div>`+st.ps.slice(0,3).map(p=>`<div class="p">${p.date.slice(5)} ${esc(p.highlight)}</div>${thumbs(p)}`).join('');
c.onclick=()=>{map.setView([s.lat,s.lon],13);mk[s.id].openPopup();window.scrollTo({top:0,behavior:'smooth'})};L2.appendChild(c)})})}
const F=document.getElementById('f');
function chip(t,on,fn){const c=document.createElement('span');c.className='chip'+(on?' on':'');c.textContent=t;c.onclick=()=>{fn();c.classList.toggle('on');render()};F.appendChild(c)}
for(let d=1;d<=6;d++)chip('Day '+d,false,()=>fDay.has(d)?fDay.delete(d):fDay.add(d));
F.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
CATS.forEach(k=>chip(k,false,()=>fCat.has(k)?fCat.delete(k):fCat.add(k)));
F.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
chip('🎯 只看命中清單',false,()=>fHit=!fHit);chip('🕒 只看近 7 天',false,()=>fRecent=!fRecent);
document.getElementById('lg').innerHTML=Object.entries(CATC).map(([k,v])=>`<span><span class="dot" style="background:${v}"></span>${k}</span>`).join('')+'<span>・圓點越大＝累積貼文越多</span>';
render();
</script>
</body>
</html>
