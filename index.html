<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>2027 山陰鳥取冬遊 | Sanin Winter Trip</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#A2C4C9" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #f9f7f5;
        --bg-glass: rgba(255, 255, 255, 0.85);
        --card-bg: #ffffff;
        --text-main: #4a4a4a;
        --text-secondary: #8c8c8c;
        --accent-pink: #e4c2c1;
        --accent-pink-hover: #d69e9d;
        --accent-green: #a9bfa8;
        --accent-green-hover: #8fa68e;
        --accent-blue: #a2c4c9;
        --accent-yellow: #e8d595;
        --border-color: #efefef;
      }
      body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        margin: 0;
        background-image: radial-gradient(#e8e8e8 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .glass-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }
      ::-webkit-scrollbar { width: 0; height: 0; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-in { animation: fade-in 0.5s ease-out; }
      .fade-in { animation-name: fade-in; }
      @keyframes pulse-soft { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
      .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="config.js"></script>

    <script type="text/babel" data-presets="env,react" src="app.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("service-worker.js")
            .then((reg) => console.log("PWA Service Worker registered!", reg))
            .catch((err) => console.log("PWA registration failed:", err));
        });
      }
    </script>
  </body>
</html>
